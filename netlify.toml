[build]
  command = "rsbuild build"
  publish = "dist"
  base = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-origin-crossed"
    Content-Security-Policy = "frame-ancestors https://www.facebook.com"

  cache-control = '''
  max-age=0,
  no-cache,
  no-store,
  must-revalidate'''

[functions]
  directory = "dist/functions"

[dev]
  command = "rsbuild dev"
  port = 3000
  publish = "dist"